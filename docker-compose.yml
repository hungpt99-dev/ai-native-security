name: ai-native-security

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-security}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-security}
      POSTGRES_DB: ${POSTGRES_DB:-security}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-security} -d ${POSTGRES_DB:-security}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: api
    command: ["alembic", "upgrade", "head"]
    env_file: [.env]
    environment:
      ANS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-security}:${POSTGRES_PASSWORD:-security}@postgres:5432/${POSTGRES_DB:-security}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: api
    env_file: [.env]
    environment:
      ANS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-security}:${POSTGRES_PASSWORD:-security}@postgres:5432/${POSTGRES_DB:-security}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - sbom-data:/app/var/sboms
      - workspace-data:/app/var/workspaces
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: worker
    env_file: [.env]
    environment:
      ANS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-security}:${POSTGRES_PASSWORD:-security}@postgres:5432/${POSTGRES_DB:-security}
    volumes:
      - sbom-data:/app/var/sboms
      - workspace-data:/app/var/workspaces
      - trivy-cache:/home/appuser/.cache/trivy
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Scanners are CPU-hungry; one worker per container keeps scans isolated.
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: scheduler
    env_file: [.env]
    environment:
      ANS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-security}:${POSTGRES_PASSWORD:-security}@postgres:5432/${POSTGRES_DB:-security}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres-data:
  sbom-data:
  workspace-data:
  trivy-cache:
