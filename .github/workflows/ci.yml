name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: security
          POSTGRES_PASSWORD: security
          POSTGRES_DB: security_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U security"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Lint
        working-directory: backend
        run: ruff check app tests
      - name: Type check
        working-directory: backend
        run: mypy app
      - name: Tests
        working-directory: backend
        env:
          ANS_TEST_DATABASE_URL: postgresql+psycopg://security:security@localhost:5432/security_test
          ANS_SECRET_KEY: ci-secret
          ANS_AI_ENABLED: "false"
        run: pytest -q
      - name: Migration up/down/up
        working-directory: backend
        env:
          ANS_DATABASE_URL: postgresql+psycopg://security:security@localhost:5432/security_mig
          ANS_SECRET_KEY: ci-secret
        run: |
          # A dedicated database: the test suite already built the head schema in
          # security_test, so applying the migration chain there would collide.
          python - <<'PY'
          import psycopg

          with psycopg.connect(
              "postgresql://security:security@localhost:5432/postgres", autocommit=True
          ) as connection:
              connection.execute("DROP DATABASE IF EXISTS security_mig")
              connection.execute("CREATE DATABASE security_mig")
          PY
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head
          alembic current

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Type check and build
        working-directory: frontend
        run: npm run build
